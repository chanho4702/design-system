name: Publish to GitHub Packages

# S-03(2026-08-30): 프론트 3곳이 tgz를 리포에 커밋해 쓰던 것을 레지스트리 소비로 바꾼다.
# GitHub Packages npm은 스코프가 소유자와 같아야 해서 @chanho4702/*로 **발행 시점에만** 이름을 바꾼다 —
# 이 리포 안의 개발 흐름(@chanho/*, workspace, tgz pack)은 그대로다. 소비자는 pnpm alias로 import를 유지한다:
#   "@chanho/react": "npm:@chanho4702/react@0.7.0"
# 이미 올라간 버전은 건너뛴다(토큰은 자주 안 바뀌어 태그마다 다시 올릴 수 없다).
on:
  push:
    tags: ['v*', 'org-admin-v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@chanho4702'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:tokens
      - run: pnpm --filter @chanho/react build
      - run: pnpm --filter @chanho/org-admin build

      - name: Publish @chanho4702/tokens (skip if version exists)
        working-directory: packages/tokens
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(node -p "require('./package.json').version")
          if npm view "@chanho4702/tokens@${VER}" version --registry https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "tokens ${VER} already published — skip"; exit 0
          fi
          npm pkg set name=@chanho4702/tokens
          npm pkg set publishConfig.registry=https://npm.pkg.github.com
          pnpm publish --no-git-checks --access public

      - name: Publish @chanho4702/react (skip if version exists)
        working-directory: packages/react
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(node -p "require('./package.json').version")
          TOKENS_VER=$(node -p "require('../tokens/package.json').version")
          if npm view "@chanho4702/react@${VER}" version --registry https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "react ${VER} already published — skip"; exit 0
          fi
          npm pkg set name=@chanho4702/react
          npm pkg set publishConfig.registry=https://npm.pkg.github.com
          # 발행 매니페스트의 tokens 의존은 레지스트리 이름으로(별칭) — 런타임 import는 없고 CSS는 소비자가 직접 가져온다
          npm pkg set "dependencies.@chanho/tokens=npm:@chanho4702/tokens@${TOKENS_VER}"
          pnpm publish --no-git-checks --access public

      - name: Publish @chanho4702/org-admin (skip if version exists)
        working-directory: packages/org-admin
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(node -p "require('./package.json').version")
          if npm view "@chanho4702/org-admin@${VER}" version --registry https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "org-admin ${VER} already published — skip"; exit 0
          fi
          npm pkg set name=@chanho4702/org-admin
          npm pkg set publishConfig.registry=https://npm.pkg.github.com
          # tokens·react는 peer로 남긴다 — 소비자가 pnpm alias로 @chanho/* 키를 이미 갖고 있어
          # 이름을 바꾸면 오히려 peer가 안 맞는다. dev 쪽 workspace 참조만 발행 시 정리한다.
          npm pkg delete devDependencies
          pnpm publish --no-git-checks --access public
